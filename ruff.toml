# Formatação e lint (T-003, DEC-027). Gates em docs/SPEC.md §8.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[lint.per-file-ignores]
# Os scripts ajustam o sys.path antes de importar src.
"scripts/*.py" = ["E402"]
# As regras de segurança reclamam de todo assert; nos testes ele é a ferramenta.
"tests/*.py" = ["S"]
